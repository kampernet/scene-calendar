# On a version tag (v0.1.0, ...), build scene-calendar.zip — a "scene-calendar/"
# folder without development files (see .gitattributes) — and attach it to a
# GitHub Release. Admins install that zip via Plugins → Add New → Upload Plugin.
name: Release zip

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -Po '^\s*\*\s*Version:\s*\K\S+' scene-calendar.php)
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match plugin header Version $version" >&2
            exit 1
          fi

      - name: Build scene-calendar.zip
        run: git archive --format=zip --prefix=scene-calendar/ -o scene-calendar.zip "$GITHUB_REF_NAME"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" scene-calendar.zip --title "Scene Calendar $GITHUB_REF_NAME" --generate-notes
